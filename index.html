<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaterConnect | Innovative Catering Search</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="database-content.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="menu-modal.css">
    <link rel="stylesheet" href="brand.css">
    
    <!-- Supabase SDK & Configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-24">


 <!-- ==================== 1. HOME VIEW ==================== -->
    <div id="view-home" class="app-view active-view">
        
        <!-- TOP HOME HEADER -->
        <header class="glass-header sticky top-0 z-50 border-b border-slate-100 px-4 py-3 flex justify-between items-center shadow-sm bg-white/90 backdrop-blur-md">
            <!-- Left Side: Logo & App Name -->
            <a href="index.html" class="brand-lockup hover:opacity-90 transition-opacity">
                <span class="brand-mark"><i class="fa-solid fa-bell-concierge"></i></span>
                <span class="brand-name">CaterConnect</span>
            </a>

            <!-- Right Side: Welcome Quote & Profile Avatar -->
            <div class="flex items-center gap-3">
                <!-- Greeting Header Text -->
                <div class="flex flex-col text-right">
                    
                    <span id="homeGreetingName" class="text-sm font-bold text-slate-800 leading-tight">Guest</span>
                </div>

                <!-- Profile Avatar Link -->
                <a href="profile.html" aria-label="Go to Profile" class="relative group flex-shrink-0">
                    <div id="homeAvatarWrapper" class="w-10 h-10 rounded-full bg-orange-100 border-2 border-orange-500 overflow-hidden flex items-center justify-center text-orange-500 shadow-sm transition-transform active:scale-95">
                        <!-- Default Fallback Icon -->
                        <i id="homeAvatarFallback" class="fa-solid fa-user text-base"></i>
                        <!-- Dynamic Profile Image -->
                        <img id="homeUserAvatar" src="" alt="Profile Photo" class="w-full h-full object-cover hidden">
                    </div>
                </a>
            </div>
        </header>
    

        <!-- Search & Discovery -->
        <section class="px-4 pt-8 pb-6 bg-white shadow-sm rounded-b-[2rem]">
            <div class="max-w-xl mx-auto space-y-4">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Find the perfect catering, <span class="text-orange-500">instantly.</span></h1>
                
                <!-- Location Input with Auto-complete Dropdown -->
                <div class="search-input-group relative">
                    <i class="fa-solid fa-location-crosshairs search-icon cursor-pointer hover:text-orange-500 transition-colors" 
                       id="detectLocationBtn" 
                       title="Detect Current Location"></i>
                    <input type="text" 
                           id="locationInput" 
                           class="search-input w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500" 
                           placeholder="Location selection (e.g., Downtown)..."
                           autocomplete="off">
                           
                    <div id="locationDropdown" class="location-dropdown hide"></div>
                </div>

                <!-- Catering Search Input -->
                <div class="search-input-group relative">
                    <i class="fa-solid fa-magnifying-glass search-icon absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" class="search-input w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Search popular catering services...">
                </div>

                <button id="searchBtn" class="primary-action-btn w-full py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold rounded-xl shadow-lg hover:opacity-95 transition-all">
                    Discover Caterers
                </button>
            </div>

            <!-- Explore Categories -->
            <div class="mt-6 pt-2 max-w-xl mx-auto">
                <h3 class="text-lg font-bold text-gray-800 mb-3 px-1">Explore by Category</h3>
                <div class="category-scroll-container flex gap-2.5 overflow-x-auto pb-2 scrollbar-none">
                    <button class="category-chip px-4 py-2 bg-gray-100 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-orange-500 hover:text-white transition-all" onclick="selectCategory(this, 'special_events')">All events</button>
                    <button class="category-chip px-4 py-2 bg-gray-100 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-orange-500 hover:text-white transition-all" onclick="selectCategory(this, 'special_events')">Special Events</button>
                    <button class="category-chip px-4 py-2 bg-gray-100 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-orange-500 hover:text-white transition-all" onclick="selectCategory(this, 'weddings')">Weddings</button>
                    <button class="category-chip px-4 py-2 bg-gray-100 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-orange-500 hover:text-white transition-all" onclick="selectCategory(this, 'corporate')">Corporate</button>
                    <button class="category-chip px-4 py-2 bg-gray-100 rounded-full text-xs font-semibold whitespace-nowrap hover:bg-orange-500 hover:text-white transition-all" onclick="selectCategory(this, 'parties')">Parties</button>
                    <button class="category-chip active px-4 py-2 bg-orange-500 text-white rounded-full text-xs font-semibold whitespace-nowrap transition-all" onclick="selectCategory(this, 'local_favorites')"> Favorites</button>
                </div>
            </div>
        </section>

        <!-- Dynamic Results -->
        <main class="px-4 py-10 max-w-6xl mx-auto">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-xl font-bold text-gray-800">Available Nearby</h2>
                <span class="text-sm font-medium text-gray-500" id="resultCount"></span>
            </div>

            <div id="resultsContainer" class="db-grid-container grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injected via Supabase JS -->
            </div>

            <div id="loading" class="text-center py-12 hide">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-orange-500"></i>
                <p class="mt-3 text-sm font-medium text-gray-500">Fetching live data...</p>
            </div>
        </main>
    </div>

    </div>

    <!-- PERMANENT NAVBAR MOUNT -->
    <div id="nav-placeholder"></div>

    <!-- Scripts -->
    <script src="location.js"></script>
    <script src="menu-modal.js"></script>
    <script src="script.js"></script>
    <script src="search.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
